name: Deploy to GitHub Pages

on:
  push:
    branches: ["master"]
    paths:
      - "index.html"
      - "games.json"
      - "data/**"
      - "CNAME"
      - ".nojekyll"
      - "assets/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
  workflow_run:
    workflows: ["Scrape Xbox Catalog"]
    types:
      - completed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # A scrape pushes with the default token, which does not retrigger
          # this workflow on push. workflow_run then checks out the default
          # branch tip, where that new catalog commit already landed.
          # head_sha is the commit the scrape started from, so leave it alone.
          ref: ${{ github.event_name == 'workflow_run' && github.event.repository.default_branch || github.sha }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Assemble site
        run: |
          set -euo pipefail
          test -f index.html
          test -f CNAME
          test -d data
          rm -rf _site
          mkdir -p _site
          cp index.html CNAME _site/
          cp -a data _site/data
          if [ -f .nojekyll ]; then
            cp -a .nojekyll _site/
          fi
          if [ -d assets ]; then
            cp -a assets _site/assets
          fi
          if [ -e _site/.claude ] || [ -e _site/README.md ] || [ -e _site/scripts ] || [ -e _site/games.json ] || [ -e _site/.github ]; then
            echo "Site artifact contains files that must not be published" >&2
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
