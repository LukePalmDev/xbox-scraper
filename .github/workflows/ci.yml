name: CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt 2>/dev/null || echo "No requirements.txt"
      - name: Check syntax
        run: python -m py_compile fetch_bigids.py fetch_xbox_og.py scraper_utils.py tests/test_scraper.py
      - name: Run offline unit tests
        run: python -m unittest discover -s tests
