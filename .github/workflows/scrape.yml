name: Scrape Xbox Catalog

on:
  schedule:
    - cron: '0 6 * * 1'  # Ogni lunedi alle 6:00 UTC
  workflow_dispatch:
    inputs:
      category:
        description: 'Categoria da scrappare'
        default: 'all'
        type: choice
        options:
          - all
          - xboxBrowse
          - xboxOG
          - xbox360
          - fullXboxOne
          - fpsBoostSeriesX
          - fpsBoostSeriesS
          - autoHDR

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Discover BigIDs
        id: discover
        continue-on-error: true
        run: python3 fetch_bigids.py --browse-delay 0 --out bigids_new.json

      - name: Use new or fallback BigIDs
        run: |
          if [ -f bigids_new.json ]; then
            mv bigids_new.json bigids.json
            echo "discovery=success" >> "$GITHUB_ENV"
          else
            echo "Discovery fallito, uso bigids.json esistente"
            echo "discovery=fallback" >> "$GITHUB_ENV"
          fi

      - name: Scrape catalog
        run: |
          CATEGORY="${{ github.event.inputs.category || 'all' }}"
          python3 fetch_xbox_og.py \
            --category "$CATEGORY" \
            --batch 50 \
            --delay 0.3 \
            --workers 3 \
            --out index.html \
            --json-out games.json

      - name: Detect changes
        id: changes
        run: |
          # Il report non pubblica data/changes: lo scrape completo l'ha già fatto.
          # Il baseline intero si usa solo con --category all. Una categoria manuale
          # confrontata con quel file segnerebbe come rimossi tutti gli altri giochi.
          CATEGORY="${{ github.event.inputs.category || 'all' }}"
          if [ "$CATEGORY" = "all" ]; then
            python3 catalog_diff.py report \
              --new games.json \
              --previous-rev HEAD \
              --games-path changelog-baseline.json \
              --preserve-failed failed_ids.json \
              --report scrape-report.json \
              --github-env "$GITHUB_ENV"
          else
            python3 catalog_diff.py report \
              --new games.json \
              --previous-rev HEAD \
              --games-path games.json \
              --report scrape-report.json \
              --github-env "$GITHUB_ENV"
          fi

      - name: Upload scrape report
        uses: actions/upload-artifact@v4
        with:
          name: scrape-report
          path: scrape-report.json

      - name: Scrape summary
        run: |
          GAMES=$(python3 -c "import json; print(len(json.load(open('games.json'))))")
          BIGIDS=$(python3 -c "import json; print(json.load(open('bigids.json'))['total'])")
          HTML_SIZE=$(du -h index.html | cut -f1)
          JSON_SIZE=$(du -h games.json | cut -f1)

          echo "## Xbox Catalog Scrape Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Metrica | Valore |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| BigIDs disponibili | $BIGIDS |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Giochi scrappati | $GAMES |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Nuovi giochi | ${{ env.ADDED }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Giochi rimossi | ${{ env.REMOVED }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Prezzi in ribasso | ${{ env.PRICE_DOWN }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Prezzi in rialzo | ${{ env.PRICE_UP }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Dimensione HTML | $HTML_SIZE |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Dimensione JSON | $JSON_SIZE |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Discovery BigID | ${{ env.discovery }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Categoria | ${{ github.event.inputs.category || 'all' }} |" >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A bigids.json index.html games.json changelog-baseline.json
          if [ -d data ]; then
            git add -A data
          fi
          if git diff --cached --quiet; then
            echo "Nessuna modifica da committare"
          else
            GAMES=$(python3 -c "import json; print(len(json.load(open('games.json'))))")
            CHANGE_MSG=""
            if [ "${{ env.ADDED }}" != "0" ]; then
              CHANGE_MSG="$CHANGE_MSG, +${{ env.ADDED }} nuovi"
            fi
            if [ "${{ env.REMOVED }}" != "0" ]; then
              CHANGE_MSG="$CHANGE_MSG, -${{ env.REMOVED }} rimossi"
            fi
            if [ "${{ env.PRICE_DOWN }}" != "0" ]; then
              CHANGE_MSG="$CHANGE_MSG, ${{ env.PRICE_DOWN }} ribassi"
            fi
            if [ "${{ env.PRICE_UP }}" != "0" ]; then
              CHANGE_MSG="$CHANGE_MSG, ${{ env.PRICE_UP }} rialzi"
            fi
            git commit -m "Auto-update: Xbox catalog ($GAMES giochi${CHANGE_MSG}) $(date +%Y-%m-%d)"
            git push
          fi
